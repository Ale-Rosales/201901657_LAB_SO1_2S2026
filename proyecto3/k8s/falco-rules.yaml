customRules:
  munk8s-rules.yaml: |-
    - rule: Lectura de archivo sensible en pods munk8s
      desc: Detecta apertura o lectura de /etc/shadow o /app/secretos en pods del namespace munk8s
      condition: >
        evt.type in (open, openat, openat2) and evt.dir=<
        and fd.name in (/etc/shadow, /app/secretos)
        and k8s.ns.name = "munk8s"
      output: >
        ALERTA munk8s: lectura de archivo sensible
        (archivo=%fd.name proceso=%proc.name cmd=%proc.cmdline
        pod=%k8s.pod.name ns=%k8s.ns.name usuario=%user.name)
      priority: WARNING
      tags: [munk8s, filesystem]
