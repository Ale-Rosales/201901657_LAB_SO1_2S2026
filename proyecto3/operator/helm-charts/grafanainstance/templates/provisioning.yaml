apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-datasource
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Valkey
        uid: valkey
        type: redis-datasource
        access: proxy
        isDefault: true
        jsonData:
          client: standalone
          poolSize: 5
          timeout: 10
        url: {{ .Values.valkeyHost }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboard-provider
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: munk8s
        folder: ""
        type: file
        disableDeletion: false
        options:
          path: /var/lib/grafana/dashboards
